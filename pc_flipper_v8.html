<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Flipper</title>
<style>:root{--bg:#0c0f14;--cd:#161b24;--ln:#262e3d;--tx:#e8ebf2;--mu:#8a93a8;--ac:#35e07f;--bd:#ff6b6b;--wn:#fbbf24;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}html,body{background:var(--bg);margin:0}
body{font:14px system-ui,sans-serif;color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
#app{max-width:520px;margin:0 auto;padding:6px 10px 90px}
h1,h2,h3{margin:6px 0}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.m{color:var(--mu);font-size:12px}
.t{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--ln);color:var(--mu)}
.g{color:var(--ac);border-color:var(--ac)}.b{color:var(--bd);border-color:var(--bd)}.w{color:var(--wn);border-color:var(--wn)}
button{background:var(--ac);color:#08210f;border:0;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:400}
button.on{border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.4}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{flex:none}
.art{width:100%;height:auto;display:block;border-radius:8px}
.it{display:flex;gap:10px;align-items:center}.it .art{width:96px;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer}
.card .art{border-radius:0}.in{padding:6px 8px}
.slot{border:1px dashed var(--ln);border-radius:8px;padding:4px;text-align:center}.slot.f{border:1px solid #60a5fa}
.ph{aspect-ratio:3/2;background:#12151b;border-radius:8px}
.bb{max-width:82%;padding:8px 11px;border-radius:14px;margin:5px 0;background:#232b3a}.bb.me{margin-left:auto;background:#1d4ed8}
.opt{display:block;width:100%;margin:6px 0;text-align:left;border-color:#2b5cd6;color:#9cc0ff}
.term{background:#05080a;border:1px solid #1d3a2a;color:var(--ac);font:12px ui-monospace,monospace;padding:9px;border-radius:8px;min-height:70px;white-space:pre-wrap}
.bar{height:12px;background:#12151b;border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
.bar u{position:absolute;left:35%;width:35%;top:0;bottom:0;background:#ffffff40}
[data-hold]{touch-action:none;user-select:none}
.zn{position:relative;margin-bottom:8px}
.zs{position:absolute;inset:0;display:grid;grid-template:1fr 1fr/1fr 1fr}
.z{background:transparent;border:1px dashed #ffffff55;color:#fff;font-size:22px;border-radius:0;font-weight:400}
select{width:100%;background:#12151b;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px;margin:6px 0}
input[type=range]{width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#10141b;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 1px;font-size:9px;font-weight:400}
.nav button.on{color:var(--ac)}.nav span{display:block;font-size:19px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:8px 14px;border-radius:20px;z-index:9;font-size:13px;display:none;max-width:90%;text-align:center}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.tr{width:84px;touch-action:none;user-select:none;text-align:center;cursor:grab}.tr .m{font-size:10px}[data-drag]{touch-action:none;cursor:grab}#gh{position:fixed;width:96px;pointer-events:none;z-index:50;opacity:.9}#gh svg{width:100%;height:auto}@keyframes pu{50%{opacity:.2}}.pul{animation:pu 1s infinite}svg text{pointer-events:none;user-select:none}.dock{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:#10141bf2;border-top:1px solid var(--ln);z-index:6}.dock .tr{width:68px;flex:none;touch-action:pan-x}.dock .tr .m{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}[data-fl]{touch-action:none;user-select:none}</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>

const CK=Object.keys(C),F={'новый':1,'б/у':.7,'гнутые ножки':.55,'из-под майнинга':.6,'нужна прошивка':.5};
const $=id=>document.getElementById(id),rnd=a=>a[Math.floor(Math.random()*a.length)],fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
let S=null,uid=1,drag=0;
const lg=m=>S.log.push('д'+S.day+': '+m);
const spec=(c,t)=>c=='cpu'?t[2]+' · '+t[3]+'Вт'+(t[4]?' · iGPU':''):c=='mb'?t[2]+' · '+t[3]:c=='ram'?t[2]:c=='gpu'?t[2]+'Вт':c=='cool'?'до '+t[2]+'Вт':c=='psu'?t[2]+'Вт':'';

/* ---- картинки деталей (SVG) ---- */
const bgr='<rect width="120" height="80" rx="8" fill="#222a38"/>';
function art(cat,t,cond){
 const n=t[0];let s=bgr,ac=/RGB/.test(n)||cat=='pc'?'#a855f7':'#60a5fa';
 if(cat=='cpu'){const amd=/Ryzen/.test(n),col=amd?'#e8590c':'#0071c5';
  s+=`<rect x="31" y="9" width="58" height="62" rx="5" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-dasharray="1.5 2"/><rect x="34" y="12" width="52" height="56" rx="4" fill="#9aa3b5"/><rect x="40" y="18" width="40" height="44" rx="2" fill="${col}"/><text x="60" y="37" fill="#fff" font-size="8" text-anchor="middle" font-weight="700">${amd?'RYZEN':'CORE'}</text><text x="60" y="50" fill="#fff" font-size="7" text-anchor="middle">${n.replace(/^(Ryzen \d |Core )/,'')}</text><path d="M34 12h8l-8 8z" fill="#d4af37"/>`;

 else if(cat=='mb'){const col=/AM/.test(t[2])?'#e8590c':'#0071c5';
  s+=`<rect x="16" y="6" width="88" height="68" rx="3" fill="#17402a"/><rect x="26" y="14" width="24" height="24" fill="#cfd5e0"/><rect x="30" y="18" width="16" height="16" fill="#555"/><rect x="26" y="41" width="24" height="5" fill="${col}"/><rect x="18" y="14" width="6" height="24" fill="#888"/>`;
  for(let i=0;i<4;i++)s+=`<rect x="${62+i*8}" y="12" width="4" height="34" fill="#111" stroke="#555"/>`;
  s+=`<rect x="24" y="56" width="62" height="4" fill="#111"/><rect x="24" y="64" width="30" height="4" fill="#111"/><text x="88" y="68" font-size="7" fill="#fff" text-anchor="end">${n.split(' ')[0]}</text>`;}
 else if(cat=='ram'){const col={DDR3:'#8b93a7',DDR4:'#3b82f6',DDR5:'#a855f7'}[t[2]];
  s+=`<rect x="8" y="24" width="104" height="32" rx="2" fill="#17402a"/><rect x="8" y="24" width="104" height="24" rx="2" fill="${col}"/><path d="M8 32h104" stroke="#0004"/><rect x="10" y="53" width="100" height="3" fill="none" stroke="#d4af37" stroke-dasharray="1.5 1.5"/><text x="60" y="41" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">${n}</text>`;}
 else if(cat=='gpu'){const col=/RX/.test(n)?'#ed1c24':'#76b900';
  const fan=x=>`<circle cx="${x}" cy="42" r="15" fill="#0b0d12" stroke="#444"/><g stroke="${col}" stroke-width="3"><line x1="${x-10}" y1="42" x2="${x+10}" y2="42"/><line x1="${x-5}" y1="33" x2="${x+5}" y2="51"/><line x1="${x+5}" y1="33" x2="${x-5}" y2="51"/></g>`;
  s+=`<rect x="6" y="20" width="108" height="46" rx="4" fill="#2b303b"/><rect x="6" y="64" width="108" height="3" fill="#d4af37"/>`+fan(36)+fan(78)+`<rect x="100" y="20" width="14" height="46" fill="${col}" opacity=".8"/>`;}
 else if(cat=='cool'){
  if(/СЖО/.test(n))s+=`<rect x="8" y="12" width="56" height="56" rx="4" fill="#2b303b"/><circle cx="36" cy="40" r="20" fill="#0b0d12" stroke="${ac}"/><circle cx="92" cy="40" r="14" fill="#555" stroke="${ac}"/><path d="M64 28h14M64 52h14" stroke="#111" stroke-width="4"/>`;
  else if(/Боксовый/.test(n))s+=`<circle cx="60" cy="40" r="28" fill="#0b0d12" stroke="#555"/><g stroke="#9aa3b5" stroke-width="3"><line x1="38" y1="40" x2="82" y2="40"/><line x1="44" y1="24" x2="76" y2="56"/><line x1="76" y1="24" x2="44" y2="56"/></g><circle cx="60" cy="40" r="5" fill="#555"/>`;
  else s+=`<rect x="34" y="8" width="52" height="52" rx="3" fill="#9aa3b5"/><path d="M34 16h52M34 24h52M34 32h52M34 40h52M34 48h52" stroke="#222a38" stroke-width="2"/><circle cx="60" cy="34" r="16" fill="none" stroke="${ac}" stroke-width="2"/><rect x="28" y="60" width="64" height="10" rx="2" fill="#555"/>`;}
 else if(cat=='paste')s+='<rect x="22" y="34" width="62" height="14" rx="3" fill="#cfd5e0"/><rect x="14" y="30" width="8" height="22" rx="2" fill="#555"/><path d="M84 38l12 4-12 4z" fill="#999"/><circle cx="102" cy="44" r="6" fill="#bbb"/><rect x="30" y="37" width="40" height="8" fill="#3b82f6"/><text x="50" y="43.5" font-size="6" fill="#fff" text-anchor="middle">PASTE</text>';
 else if(cat=='ssd'){const cap=(n.match(/\d+[GT]B/)||[''])[0];
  if(/HDD/.test(n))s+='<rect x="22" y="8" width="76" height="60" rx="4" fill="#9aa3b5"/><circle cx="56" cy="36" r="22" fill="#222a38" stroke="#555"/><circle cx="56" cy="36" r="5" fill="#9aa3b5"/><path d="M92 18l-22 14" stroke="#555" stroke-width="3"/>';
  else if(/NVMe/.test(n))s+='<rect x="8" y="26" width="100" height="22" rx="2" fill="#17402a"/><rect x="20" y="30" width="22" height="14" fill="#111"/><rect x="48" y="30" width="14" height="14" fill="#111"/><rect x="66" y="30" width="14" height="14" fill="#111"/><rect x="108" y="26" width="4" height="22" fill="#d4af37"/>';
  else s+='<rect x="20" y="8" width="80" height="60" rx="4" fill="#3b4252"/><rect x="26" y="14" width="68" height="30" rx="2" fill="#60a5fa"/><text x="60" y="34" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">SSD</text><rect x="26" y="56" width="22" height="6" fill="#d4af37"/>';
  s+=`<text x="60" y="76" font-size="8" fill="#fff" text-anchor="middle">${cap}</text>`;}
 else if(cat=='psu')s+=`<rect x="22" y="10" width="76" height="54" rx="4" fill="#2b303b"/><circle cx="60" cy="36" r="18" fill="#0b0d12" stroke="#555"/><g stroke="#555" stroke-width="2"><line x1="44" y1="36" x2="76" y2="36"/><line x1="52" y1="23" x2="68" y2="49"/><line x1="68" y1="23" x2="52" y2="49"/></g><text x="60" y="75" font-size="8" fill="#fbbf24" text-anchor="middle" font-weight="700">${t[2]}W</text><path d="M98 30q16 0 16 14" stroke="#e5e7eb" fill="none" stroke-width="3"/>`;
 else if(cat=='mon')s+=`<rect x="12" y="8" width="96" height="56" rx="3" fill="#111" stroke="#555"/><rect x="16" y="12" width="88" height="46" fill="#2563eb"/><rect x="24" y="20" width="26" height="16" fill="#ffffff55"/><path d="M60 64v8M44 74h32" stroke="#888" stroke-width="3"/>`;
 else if(cat=='kb')s+=`<rect x="6" y="20" width="108" height="40" rx="4" fill="#2b303b"/><path d="M12 29h96M12 37h96M12 45h96" stroke="${/Кастом/.test(n)?(t[2]||'#f472b6'):/RGB/.test(n)?'#a855f7':'#9aa3b5'}" stroke-width="5" stroke-dasharray="5 2"/><rect x="34" y="50" width="52" height="5" rx="2" fill="#9aa3b5"/>`;
 else if(cat=='ms')s+=`<path d="M42 12q18-8 36 0l4 38q-22 24-44 0z" fill="#2b303b" stroke="${/Игров/.test(n)?'#ef4444':'#9aa3b5'}" stroke-width="2"/><path d="M60 12v20M42 32h36" stroke="#9aa3b5"/>`;
 else if(cat=='promo')s+=`<rect x="12" y="18" width="96" height="44" rx="6" fill="#7c3aed"/><circle cx="12" cy="40" r="6" fill="#222a38"/><circle cx="108" cy="40" r="6" fill="#222a38"/><path d="M30 22v36" stroke="#fff6" stroke-dasharray="3 3"/><text x="70" y="38" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">PROMO</text><text x="70" y="52" font-size="7" fill="#ddd6fe" text-anchor="middle">${n.replace(/^(Промокод |Подписка )/,'').slice(0,18)}</text>`;
 else if(cat=='kcase')s+=`<rect x="8" y="16" width="104" height="48" rx="6" fill="#374151" stroke="#9ca3af"/><rect x="14" y="22" width="92" height="36" rx="3" fill="#111827"/><path d="M18 30h84M18 40h84M18 50h84" stroke="#4b5563" stroke-width="5" stroke-dasharray="5 2"/><text x="60" y="74" font-size="8" fill="#fff" text-anchor="middle">${t[2]}</text>`;
 else if(cat=='sw')s+=`<rect x="40" y="18" width="40" height="44" rx="4" fill="#e5e7eb"/><rect x="48" y="26" width="24" height="24" rx="2" fill="${t[2]}"/><rect x="56" y="10" width="8" height="14" fill="${t[2]}"/><path d="M50 62v10M70 62v10" stroke="#d4af37" stroke-width="3"/>`;
 else if(cat=='kcap')s+=`<g fill="${t[2]}" stroke="#0005">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${10+(i%4)*26}" y="${14+((i/4)|0)*28}" width="22" height="24" rx="4"/>`).join('')}</g>`;
 else if(cat=='usb')s+=`<rect x="10" y="32" width="24" height="16" fill="#cfd5e0"/><rect x="34" y="26" width="64" height="28" rx="5" fill="#1d4ed8"/><text x="66" y="40" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">${/Windows/.test(n)?'Win '+(n.match(/\d+/)||[''])[0]:n.split(' ')[0]}</text><text x="66" y="50" font-size="7" fill="#cfe" text-anchor="middle">${/Pro/.test(n)?'Pro':/Home/.test(n)?'Home':''}</text>`;
 else s+=`<rect x="34" y="6" width="52" height="68" rx="4" fill="#2b303b" stroke="#555"/><rect x="39" y="12" width="32" height="44" rx="2" fill="#111827" stroke="${ac}"/><circle cx="55" cy="26" r="8" fill="none" stroke="${ac}"/><circle cx="55" cy="44" r="8" fill="none" stroke="${ac}"/><rect x="74" y="12" width="8" height="56" fill="#1f2530"/><rect x="40" y="62" width="30" height="6" fill="#1f2530"/>`;

}

/* ---- логика ---- */
const val=i=>val0(i)+(i.bn?i.bn.reduce((a,x)=>a+val0(x)*(x.cat=='promo'?1.5:1.15),0):0);const val0=i=>i.cat=='pc'?i.parts.reduce((s,x)=>s+x.tpl[1]*S.mkt[x.cat],0)*.85*i.q/100*(i.virus?.8:1)+(i.os?i.os[1]:0)+swv(i):i.tpl[1]*S.mkt[i.cat]*F[i.cond]*(i.broken?.3:1);
const ask=(i,mk)=>Math.max(10,Math.round(i.paid*(1+mk/100)/10)*10);
const chn=(a,f)=>{const x=a/f;return x<=.8?.3:x>=1.5?.01:Math.max(.01,.3*(1.5-x)/.7)};
const dem=c=>c>.2?'высокий':c>.12?'средний':c>.05?'низкий':'очень низкий';
function mkL(cat){cat=cat||rnd(CK);const tpl=rnd(C[cat][1]);let cond=Math.random()<.3?'новый':'б/у';
 if(cond=='б/у'){if(cat=='cpu'&&Math.random()<.3)cond='гнутые ножки';if(cat=='gpu'&&Math.random()<.45)cond='из-под майнинга';if((cat=='mb'||cat=='gpu')&&cond=='б/у'&&Math.random()<.3)cond='нужна прошивка'}
 const bad=cond=='б/у'?Math.random()<.1:cond=='из-под майнинга'?Math.random()<.4:false,scam=Math.random()<.06;
 let p=tpl[1]*S.mkt[cat]*F[cond]*(.92+Math.random()*.16);if(scam)p*=.5;

 else h+=`<div class="c"><b>Шаг 3 из 3 · прошивка</b><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,v.i/v.lines.length*100)}%"></i></div><div class="m">Не отключай питание...</div></div><div class="term">${v.log.join('\n')}▌</div>`;

 if(v.st==1){const m=$('fm');
  if(!v.ph){v.p=fh.p&&fh.v?v.p+7:Math.max(0,v.p-5);if(v.p>=100){v.ph=1;v.p=0;if(m)m.textContent='Отпусти ПИТАНИЕ! BIOS− держи ещё 3 секунды'}}

 const t=k=='ok'?'Прошивка встала!':k=='lock'?'BIOS-блокировка 💀':'Кирпич 🧱',s=k=='ok'?'Деталь снова работает.':k=='lock'?'Прошивка встала, но на экране пароль администратора. Снять нельзя: деталь идёт на запчасти.':'Микросхема умерла. Деталь годится только на запчасти.';
 S.view={t:'res',title:t,delta:Math.round(val(it)-it.paid),item:it,sub:s+' Рынок: '+fmt(old)+' → '+fmt(val(it))+'. Шанс поймать блокировку — 1 из 6.',tab:'inv',btn:'Рискнёшь ещё раз?'};render()}

 if(S.over){A.innerHTML=`<div class="c" style="text-align:center;padding:24px"><h1>Игра окончена</h1><p class="m">${S.over}</p><button data-a="restart">Начать заново</button></div>`;return}
 const v=S.view,nv=[['feed','▦','Авито'],['msg','💬','Чаты'],['inv','📦','Склад'],['bench','🔧','Сборка'],['dark','🕶️','Тёмный'],['ai','🤖','ИИ'],['me','👤','Профиль']];

function tick(){if(!S||S.over)return;S.t++;let ch=0;const v=S.view;
 if(v&&v.t=='insp'){v.left--;const e=$('tm');if(e)e.textContent=v.left+' с';if(v.left<=0){S.view=null;toast('Время вышло: продавец ушёл');ch=1}}
 if(S.t%3==0)for(const s of S.sales)if(!S.offers.some(o=>o.id==s.it.id)&&Math.random()<chn(s.ask,val(s.it))*.9*(.7+rating()*.1)){S.offers.push({id:s.it.id,it:s.it,ask:s.ask,off:Math.round(s.ask*(.75+Math.random()*.25)/10)*10,name:rnd(NAMES),ttl:40});toast('💬 Новое сообщение от покупателя');ch=1}
 const n=S.offers.length;S.offers.forEach(o=>o.ttl--);S.offers=S.offers.filter(o=>o.ttl>0);if(S.offers.length!=n)ch=1;
 if(S.t%30==0){S.day++;S.dk.day=0;CK.forEach(c=>S.mkt[c]=Math.min(1.3,Math.max(.75,S.mkt[c]*(.96+Math.random()*.08))));if(S.loan){S.loan.owed=Math.round(S.loan.owed*1.02);if(S.day>S.loan.due)S.over='Кредит не вернули вовремя. Банк забрал всё.'}ch=1}
